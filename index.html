<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kargo Bandı: Antika Atölyesi</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1e140c;font-family:sans-serif;color:#f7e7ce}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;background:rgba(20,12,6,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:10}
#ui.hide{display:none}
h1{font-size:32px;color:#ffcf70;margin-bottom:10px}
p{max-width:380px;font-size:15px;color:#e2cbb0;margin-bottom:20px;line-height:1.4}
#stat{background:#3e2816;border:1px solid #a67438;border-radius:10px;padding:12px 20px;margin-bottom:18px;display:none}
button{background:#d48f28;color:#1e1004;font-weight:bold;font-size:18px;padding:14px 32px;border:2px solid #ffe094;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<div id="ui">
  <h1 id="t">Kargo Bandı</h1>
  <p id="d">Banttan gelen antikaları aşağıdaki doğru ahşap sandıklara sürükle ve paketle!</p>
  <div id="stat"></div>
  <button id="btn">MESAİYE BAŞLA</button>
</div>
<canvas id="c"></canvas>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const c=document.getElementById('c'),x=c.getContext('2d'),ui=document.getElementById('ui'),btn=document.getElementById('btn'),tEl=document.getElementById('t'),dEl=document.getElementById('d'),stEl=document.getElementById('stat');
let W=0,H=0,bins=[],items=[],parts=[],texts=[],run=false,score=0,best=+localStorage.getItem('kb_best')||0,lives=3,lvl=1,combo=0,done=0,belt=0,timer=0,drag=null,dx=0,dy=0,last=0,ac=null;
const CATS=[
  {id:'v',n:'Çini Vazo',e:'🏺',bg:'#2b6cb0',bd:'#63b3ed'},
  {id:'w',n:'Cep Saati',e:'🕰️',bg:'#b7791f',bd:'#f6e05e'},
  {id:'c',n:'Pusula',e:'🧭',bg:'#2f855a',bd:'#68d391'},
  {id:'k',n:'Kral Tacı',e:'👑',bg:'#9b2c2c',bd:'#fc8181'}
];
function snd(f,tp,du){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+du);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+du);
  }catch(e){}
}
function resize(){
  W=c.width=innerWidth;H=c.height=innerHeight;
  const cols=W<540?2:4,rows=W<540?2:1,p=12,top=H*.55,ah=H*.4,bw=(W-p*(cols+1))/cols,bh=(ah-p*(rows-1))/rows;
  bins=CATS.map((cat,i)=>({...cat,x:p+(i%cols)*(bw+p),y:top+Math.floor(i/cols)*(bh+p),w:bw,h:bh,pu:0}));
}
addEventListener('resize',resize);
function spawn(){
  const cat=CATS[Math.floor(Math.random()*CATS.length)],r=Math.min(36,Math.max(25,W*.065));
  items.push({cat,x:-r,y:H*.32,r,drag:false});
}
function fx(px,py,col,txt){
  for(let i=0;i<14;i++){const a=Math.random()*6.28,s=2+Math.random()*4;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,col});}
  if(txt)texts.push({x:px,y:py-15,txt,col,l:1});
}
function start(){
  score=0;lives=3;lvl=1;combo=0;done=0;items=[];parts=[];texts=[];drag=null;timer=.4;run=true;
  ui.classList.add('hide');spawn();
}
function over(){
  run=false;if(score>best){best=score;localStorage.setItem('kb_best',best);}
  tEl.textContent='Mesai Bitti!';dEl.textContent='Antikalar kırıldı veya banttan düştü.';
  stEl.style.display='block';stEl.innerHTML=`<b>Puan: ${score}</b><br>En Yüksek: ${best}`;
  btn.textContent='TEKRAR OYNA';ui.classList.remove('hide');
}
function pos(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top};}
function down(e){
  if(!run)return;const p=pos(e);
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(Math.hypot(p.x-it.x,p.y-it.y)<=it.r*1.5){drag=it;it.drag=true;dx=it.x-p.x;dy=it.y-p.y;snd(320,'sine',.07);break;}
  }
}
function move(e){if(run&&drag){e.preventDefault();const p=pos(e);drag.x=p.x+dx;drag.y=p.y+dy;}}
function up(){
  if(!run||!drag)return;const it=drag;it.drag=false;drag=null;
  const b=bins.find(b=>it.x>=b.x&&it.x<=b.x+b.w&&it.y>=b.y&&it.y<=b.y+b.h);
  if(b){
    items.splice(items.indexOf(it),1);
    if(b.id===it.cat.id){
      combo++;done++;const pts=10+combo*2;score+=pts;b.pu=1;snd(440+combo*25,'triangle',.14);
      fx(it.x,it.y,b.bd,`+${pts}`);if(done%10===0){lvl++;fx(W/2,H*.2,'#ffcf70',`SEVİYE ${lvl}!`);}
    }else{
      combo=0;lives--;snd(140,'sawtooth',.25);fx(it.x,it.y,'#fc8181','YANLIŞ!');if(lives<=0)over();
    }
  }else it.y=H*.32;
}
c.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);
c.addEventListener('touchstart',down,{passive:false});addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);
btn.addEventListener('click',start);
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(run){
    const spd=75+(lvl-1)*18;belt=(belt+spd*dt)%40;timer-=dt;
    if(timer<=0){spawn();timer=Math.max(.85,2.2-(lvl-1)*.16);}
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      if(!it.drag){
        it.x+=spd*dt;it.y=H*.32;
        if(it.x-it.r>W){items.splice(i,1);combo=0;lives--;snd(140,'sawtooth',.25);fx(W-60,H*.28,'#fc8181','KAÇTI!');if(lives<=0)over();}
      }
    }
    bins.forEach(b=>{if(b.pu>0)b.pu=Math.max(0,b.pu-dt*3);});
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l-=dt*1.8;if(p.l<=0)parts.splice(i,1);}
    for(let i=texts.length-1;i>=0;i--){const f=texts[i];f.y-=40*dt;f.l-=dt*1.3;if(f.l<=0)texts.splice(i,1);}
  }
  x.fillStyle='#23150a';x.fillRect(0,0,W,H);
  x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,0,W,56);
  x.font='bold 18px sans-serif';x.fillStyle='#ffcf70';x.textAlign='left';x.fillText('💰 '+score,16,35);
  x.textAlign='center';x.fillStyle='#e2cbb0';x.fillText('Seviye '+lvl,W/2,35);
  x.textAlign='right';x.fillText('❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives)),W-16,35);
  const by=H*.32;x.fillStyle='#3b3734';x.fillRect(0,by-40,W,80);
  x.fillStyle='#6e4722';x.fillRect(0,by-48,W,8);x.fillRect(0,by+40,W,8);
  x.strokeStyle='#555';x.lineWidth=3;
  for(let i=-40+belt;i<W+40;i+=40){x.beginPath();x.moveTo(i,by-35);x.lineTo(i+15,by);x.lineTo(i,by+35);x.stroke();}
  bins.forEach(b=>{
    x.save();if(b.pu>0){const s=1+Math.sin(b.pu*3.14)*.06;x.translate(b.x+b.w/2,b.y+b.h/2);x.scale(s,s);x.translate(-(b.x+b.w/2),-(b.y+b.h/2));}
    x.fillStyle=b.bg;x.beginPath();x.roundRect(b.x,b.y,b.w,b.h,12);x.fill();
    x.strokeStyle=b.bd;x.lineWidth=3;x.stroke();
    x.font=Math.min(40,b.h*.42)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(b.e,b.x+b.w/2,b.y+b.h*.42);
    x.font='bold 14px sans-serif';x.fillStyle='#fff';x.fillText(b.n,b.x+b.w/2,b.y+b.h*.78);x.restore();
  });
  items.forEach(it=>{
    x.save();x.translate(it.x,it.y);if(it.drag)x.scale(1.2,1.2);
    x.fillStyle='#8c5828';x.beginPath();x.arc(0,0,it.r,0,6.28);x.fill();
    x.strokeStyle='#ffcf70';x.lineWidth=3;x.stroke();
    x.font=(it.r*1.2)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(it.cat.e,0,2);x.restore();
  });
  parts.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,5,0,6.28);x.fill();});
  texts.forEach(f=>{x.globalAlpha=Math.max(0,f.l);x.font='bold 18px sans-serif';x.fillStyle=f.col;x.textAlign='center';x.fillText(f.txt,f.x,f.y);});
  x.globalAlpha=1;requestAnimationFrame(loop);
}
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
